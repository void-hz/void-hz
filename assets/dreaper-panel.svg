<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" role="img" aria-label="Dreaper project">
<rect width="1600" height="470" fill="#0c0e11"/>
<text x="70" y="54" fill="#9da3a5" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">02 / FEATURED BUILD</text>
<text x="70" y="116" fill="#f0f1ed" font-family="Arial" font-size="54" font-weight="800" letter-spacing="8">DREAPER</text>
<text x="72" y="150" fill="#bcff3a" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">NETWORK RECONNAISSANCE × VULNERABILITY INTELLIGENCE</text>
<text x="72" y="205" fill="#f0f1ed" font-family="Arial" font-size="24" font-weight="700">A Python tool in development.</text>
<text x="72" y="240" fill="#9da3a5" font-family="Arial" font-size="18">Turn raw Nmap reconnaissance into structured</text>
<text x="72" y="270" fill="#9da3a5" font-family="Arial" font-size="18">security findings that are easier to investigate.</text>
<text x="72" y="410" fill="#ff5c4d" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">STATUS / IN DEVELOPMENT</text>
<text x="500" y="410" fill="#9da3a5" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">DISCOVER → PARSE → CORRELATE → REPORT</text>
<rect x="760" y="70" width="760" height="310" rx="14" fill="#090b0d" stroke="#2a2f31" stroke-width="2"/>
<text x="795" y="105" fill="#f0f1ed" font-family="monospace" font-size="16">$ dreaper scan --target 10.10.10.0/24</text>
<text x="795" y="145" fill="#bcff3a" font-family="monospace" font-size="15">&gt; discovery</text><text x="795" y="170" fill="#f0f1ed" font-family="monospace" font-size="15">22/tcp   open   ssh</text><text x="795" y="195" fill="#f0f1ed" font-family="monospace" font-size="15">80/tcp   open   http</text><text x="795" y="220" fill="#f0f1ed" font-family="monospace" font-size="15">443/tcp  open   https</text><text x="795" y="245" fill="#bcff3a" font-family="monospace" font-size="15">&gt; parse</text><text x="795" y="270" fill="#9da3a5" font-family="monospace" font-size="15">service → version → evidence</text><text x="795" y="295" fill="#bcff3a" font-family="monospace" font-size="15">&gt; correlate</text><text x="795" y="320" fill="#9da3a5" font-family="monospace" font-size="15">advisory / vulnerability intelligence</text><text x="795" y="345" fill="#bcff3a" font-family="monospace" font-size="15">&gt; report</text><text x="795" y="370" fill="#9da3a5" font-family="monospace" font-size="15">finding → impact → remediation</text>
</svg>