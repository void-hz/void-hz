<text x="70" y="112" fill="#f0f1ed" font-family="Arial" font-size="38" font-weight="800">Still learning. Building for real.</text>
<path d="M70 160H1530" stroke="#2a2f31" stroke-width="2"/>
<text x="70" y="208" fill="#f0f1ed" font-family="Arial" font-size="22" font-weight="700">I’m building practical security capability</text>
<text x="70" y="242" fill="#9da3a5" font-family="Arial" font-size="20">from fundamentals — networking, HTTP, Linux,</text>
<text x="70" y="273" fill="#9da3a5" font-family="Arial" font-size="20">enumeration, vulnerability validation and reporting.</text>
<text x="70" y="326" fill="#dac9a5" font-family="Arial" font-size="18" font-weight="700">The goal is not to collect tools.</text>
<text x="70" y="356" fill="#f0f1ed" font-family="Georgia" font-size="18">It is to understand what they are telling me.</text>
